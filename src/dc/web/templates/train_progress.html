{% extends "base.html" %}
{% block title %}Training… - Fast Miner{% endblock %}
{% block page_title %}Training{% endblock %}

{% block content %}
<div class="fm-card" style="max-width:600px;">
  <div class="fm-card-header">
    <h4>Training in progress</h4>
  </div>
  <div class="fm-card-body">
    <p>Running in the background. The page will redirect when complete.</p>

    <div id="status" class="small mb-2" style="color:var(--accent); font-weight:500;">
      Starting…
    </div>

    <div class="progress mb-3">
      <div id="bar" class="progress-bar progress-bar-animated" style="width:10%;"></div>
    </div>

    <pre id="log" style="max-height:260px;overflow:auto;font-size:12px;"></pre>
  </div>
</div>

<script>
  const jobId = "{{ job_id }}";
  const logEl  = document.getElementById('log');
  const status = document.getElementById('status');
  const bar    = document.getElementById('bar');
  let pct = 10;

  function poll() {
    fetch('/train/status/' + jobId)
      .then(r => r.json())
      .then(data => {
        if (data.status === 'running') {
          if (data.messages) {
            for (let m of data.messages) {
              if (m[0] === 'progress') {
                status.textContent = m[1];
                logEl.textContent += m[1] + '\n';
                logEl.scrollTop = logEl.scrollHeight;
                if (typeof m[2] === 'number') {
                  pct = Math.max(10, Math.min(95, Math.round(m[2] * 100)));
                  bar.style.width = pct + '%';
                }
              }
            }
          }
          setTimeout(poll, 1000);
        } else if (data.status === 'done') {
          status.textContent = 'Complete - redirecting…';
          bar.style.width = '100%';
          bar.classList.remove('progress-bar-animated');
          window.location = data.redirect;
        } else if (data.status === 'error') {
          status.textContent = 'Error';
          status.style.color = 'var(--danger)';
          logEl.textContent = data.error;
          bar.classList.remove('progress-bar-animated');
          bar.style.background = 'var(--danger)';
        }
      })
      .catch(() => setTimeout(poll, 1500));
  }
  poll();
</script>
{% endblock %}
