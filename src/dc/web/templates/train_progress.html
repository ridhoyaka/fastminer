{% extends "base.html" %}
{% block title %}Training... - Fast Miner{% endblock %}
{% block content %}
<div class="row">
  <div class="col-lg-8 mx-auto">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title">Training in progress</h4>
        <p class="text-muted">This runs in the background. Page will redirect when complete.</p>
        <div id="status" class="mb-2">Starting...</div>
        <div class="progress">
          <div id="bar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 10%"></div>
        </div>
        <pre id="log" class="mt-3" style="max-height: 300px; overflow:auto;"></pre>
      </div>
    </div>
  </div>
</div>
<script>
  const jobId = "{{ job_id }}";
  const log = document.getElementById('log');
  const status = document.getElementById('status');
  const bar = document.getElementById('bar');
  let pct = 10;
  function poll() {
    fetch('/train/status/' + jobId)
      .then(r => r.json())
      .then(data => {
        if (data.status === 'running') {
          if (data.messages) {
            for (let m of data.messages) {
              if (m[0] === 'progress') {
                status.textContent = m[1];
                if (typeof m[2] === 'number') {
                  pct = Math.max(10, Math.min(95, Math.round(m[2]*100)));
                  bar.style.width = pct + '%';
                }
              }
            }
          }
          setTimeout(poll, 1000);
        } else if (data.status === 'done') {
          status.textContent = 'Complete - redirecting...';
          bar.style.width = '100%';
          bar.classList.remove('progress-bar-animated');
          window.location = data.redirect;
        } else if (data.status === 'error') {
          status.textContent = 'Error';
          log.textContent = data.error;
          bar.classList.remove('progress-bar-animated');
          bar.classList.add('bg-danger');
        }
      })
      .catch(() => setTimeout(poll, 1500));
  }
  poll();
</script>
{% endblock %}
